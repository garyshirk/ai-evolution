[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evolution"
version = "0.6.0"
description = "An incremental laboratory for agent-based evolutionary experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["Flask==3.1.2"]

[tool.setuptools.packages.find]
include = ["ai_evolution*"]

[tool.setuptools.package-data]
"ai_evolution.web" = ["static/*"]
